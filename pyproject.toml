[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freecad-cli"
version = "0.1.0"
description = "CLI tool for controlling FreeCAD via XML-RPC"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
]

[project.scripts]
freecad-cli = "freecad_cli.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# FreeCAD requires these module names for addon discovery and initialization.
"addon/FreecadCli/InitGui.py" = ["N999"]
"addon/FreecadCli/__init__.py" = ["N999"]
# The RPC server executes supplied Python code and returns any execution exception.
"addon/FreecadCli/rpc_server.py" = ["S102", "BLE001"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.9",
]
